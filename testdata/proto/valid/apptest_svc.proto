edition = "2023";

// A service contract for apptest, hand-written.
//
// calque's service target can generate one of these, and this is deliberately not
// what it generates: it is small, it is 2-space indented, and its Select carries
// only `all`. That is the point. The Go and TypeScript targets *read* a contract
// rather than assuming one, so the fixture they read is a hand-written file that
// exercises the shapes that matter — the ref oneof, a get, and a list whose
// response wraps the entity in a field — and nothing more.
//
// Replacing this with real generated output would move the 70 goldens that read
// it, and would stop testing that a hand-written contract works. The service
// target's own goldens are separate, in target/service/testdata.
package apptest;

import "apptest.proto";

option go_package = "example.com/apptest/oas";

message TenantRef {
  oneof key {
    bytes id = 1;
    string alias = 4;
  }
}

message TenantSelect {
  bool all = 1;
}

message TenantGetRequest {
  TenantRef ref = 1;
  TenantSelect select = 2;
}

service TenantService {
  rpc Get(TenantGetRequest) returns (Tenant);
}

message UserRefBySlug {
  string alias = 4;
  TenantRef tenant = 2;
}

message UserRef {
  oneof key {
    bytes id = 1;
    UserRefBySlug slug = 4;
  }
}

message UserSelect {
  bool all = 1;
}

message UserGetRequest {
  UserRef ref = 1;
  UserSelect select = 2;
}

message UserListRequest {}

message UserListResponse {
  repeated User items = 1;
}

service UserService {
  rpc Add(User) returns (User);
  rpc Get(UserGetRequest) returns (User);
  rpc List(UserListRequest) returns (UserListResponse);
}
