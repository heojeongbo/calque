edition = "2023";

package invalid;

import "google/protobuf/timestamp.proto";
import "orm.proto";

option features.field_presence = IMPLICIT;

message T {
  bytes id = 1 [(orm.field) = {type: TYPE_UUID key: true default: ""}];
  string alias = 4 [(orm.field) = {default: ""}];
  google.protobuf.Timestamp date_erased = 9 [(orm.field) = {erased: {}}];
  option (orm.message) = {
    rpc: {crud: true}
    indexes: [{name: "slug" refs: [{name: "alias" number: 4}] includes_erased: true}]
  };
}
